<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="512" height="512" fill="url(#grid)"/>
  
  <!-- Main icon shape - stylized "Z" with play button -->
  <g filter="url(#glow)">
    <!-- Outer rounded square background -->
    <rect x="32" y="32" width="448" height="448" rx="80" fill="#0a0f1a" stroke="url(#accent1)" stroke-width="2" opacity="0.3"/>
    
    <!-- Inner accent border -->
    <rect x="48" y="48" width="416" height="416" rx="64" fill="none" stroke="url(#accent1)" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Main Z shape with gradient -->
    <path d="M120 100 L392 100 L152 412 L424 412" 
          fill="none" 
          stroke="url(#accent1)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"/>
    
    <!-- Play triangle overlay -->
    <polygon points="280,200 280,312 360,256" 
             fill="url(#accent2)" 
             filter="url(#inner-glow)"
             opacity="0.95"/>
    
    <!-- Accent dots -->
    <circle cx="120" cy="100" r="14" fill="url(#accent2)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="392" cy="100" r="14" fill="url(#accent2)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="152" cy="412" r="14" fill="url(#accent2)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="424" cy="412" r="14" fill="url(#accent2)" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Subtle ring around play button -->
    <circle cx="320" cy="256" r="52" fill="none" stroke="url(#accent2)" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Subtle corner accents -->
  <g opacity="0.15">
    <path d="M20 20 L80 20 M20 20 L20 80" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M492 20 L432 20 M492 20 L492 80" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 492 L80 492 M20 492 L20 432" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M492 492 L432 492 M492 492 L492 432" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>