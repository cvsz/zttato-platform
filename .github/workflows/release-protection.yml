name: Release Protection

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-protection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-security:
    name: Container security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build release candidate image
        run: docker build --pull -t zttato:release-candidate .

      - name: Scan release candidate for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zttato:release-candidate
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: zttato:release-candidate
          format: spdx-json
          output-file: zttato-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify SBOM output
        shell: bash
        run: |
          set -euo pipefail
          test -s zttato-sbom.spdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("zttato-sbom.spdx.json").read_text())
          assert data.get("spdxVersion", "").startswith("SPDX-")
          assert data.get("packages"), "SBOM must contain package inventory"
          PY

  provenance:
    name: Immutable source bundle and provenance
    needs: release-security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Release tags must use SemVer-style vMAJOR.MINOR.PATCH syntax." >&2
              exit 1
            }
          else
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
              echo "Manual release rehearsal must run from main." >&2
              exit 1
            }
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Release source must already be contained in main." >&2
            exit 1
          }

      - name: Build deterministic source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          base="zttato-${GITHUB_SHA}"
          git archive --format=tar --prefix="${base}/" -o "dist/release/${base}.tar" "${GITHUB_SHA}"
          gzip -n "dist/release/${base}.tar"
          (
            cd dist/release
            sha256sum "${base}.tar.gz" > "${base}.sha256"
          )

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attest source bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/*.tar.gz
